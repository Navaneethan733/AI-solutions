<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Page Not Found | STACKLY</title>
  <!-- Use the same font stack for consistency, no external stylesheet needed -->
  <style>
    /* ===== RESET & GLOBAL ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #0f172a;
      line-height: 1.5;
    }

    /* ===== MAIN 404 CARD ===== */
    .error-card {
      max-width: 720px;
      width: 100%;
      background: #ffffff;
      border-radius: 36px;
      padding: 60px 48px;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(0, 0, 0, 0.04);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    /* subtle accent glow (matches agency dark boxes) */
    .error-card::before {
      content: '';
      position: absolute;
      top: -40%;
      left: -20%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(242, 87, 63, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .error-card > * {
      position: relative;
      z-index: 1;
    }

    /* ===== VISUAL: 404 + AI ROBOT HAND (CSS only) ===== */
    .error-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .error-code {
      font-size: clamp(90px, 22vw, 140px);
      font-weight: 800;
      letter-spacing: -6px;
      line-height: 1;
      background: linear-gradient(135deg, #0f172a 0%, #334155 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .error-code .accent-digit {
      background: linear-gradient(135deg, #f2573f 0%, #e11d48 60%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* small decorative robo-hand / AI icon using pure CSS */
    .robot-hand-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      background: #141518;
      border-radius: 28px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
      color: #ffffff;
      font-size: 34px;
      font-weight: 800;
      transform: rotate(-6deg);
      transition: transform 0.4s ease;
      flex-shrink: 0;
    }

    .robot-hand-icon span {
      transform: rotate(6deg);
      display: inline-block;
      background: linear-gradient(135deg, #f2573f, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 42px;
      line-height: 1;
    }

    .error-card:hover .robot-hand-icon {
      transform: rotate(0deg) scale(1.02);
    }

    /* ===== TITLE & DESCRIPTION ===== */
    .error-title {
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 800;
      letter-spacing: -1px;
      color: #0f172a;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .error-message {
      font-size: 16px;
      color: #64748b;
      max-width: 480px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }

    /* ===== ACTIONS (GO BACK + HOME) ===== */
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    /* primary "Go Back" button — stands out */
    .btn-goback {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #141518;
      color: #ffffff;
      padding: 16px 38px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border: 2px solid #141518;
      box-shadow: 0 8px 20px rgba(20, 21, 24, 0.25);
      cursor: pointer;
    }

    .btn-goback:hover {
      background: #2d2f36;
      border-color: #2d2f36;
      transform: translateY(-3px);
      box-shadow: 0 14px 28px rgba(20, 21, 24, 0.35);
    }

    .btn-goback:active {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(20, 21, 24, 0.3);
    }

    .btn-goback .arrow {
      font-size: 18px;
      line-height: 1;
      transition: transform 0.25s ease;
    }

    .btn-goback:hover .arrow {
      transform: translateX(-4px);
    }

    /* secondary "Home" button – soft, matches brand */
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: #0f172a;
      padding: 16px 32px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      border: 1.5px solid #e2e8f0;
    }

    .btn-home:hover {
      background: #ffffff;
      border-color: #94a3b8;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
    }

    /* ===== SMALL HINT / SUPPORT ===== */
    .error-hint {
      font-size: 13.5px;
      color: #94a3b8;
      border-top: 1px solid #eef2f6;
      padding-top: 24px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .error-hint a {
      color: #f2573f;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1px dashed #f2573f;
      transition: opacity 0.2s;
    }

    .error-hint a:hover {
      opacity: 0.7;
    }

    /* ===== DECORATIVE BADGE (matches STACKLY style) ===== */
    .stackly-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f2573f;
      background: rgba(242, 87, 63, 0.08);
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 20px;
      border: 1px solid rgba(242, 87, 63, 0.2);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .error-card {
        padding: 40px 24px;
        border-radius: 28px;
      }

      .error-code {
        font-size: 90px;
        letter-spacing: -3px;
      }

      .robot-hand-icon {
        width: 60px;
        height: 60px;
        border-radius: 20px;
        font-size: 26px;
      }

      .robot-hand-icon span {
        font-size: 32px;
      }

      .error-actions {
        flex-direction: column;
        width: 100%;
      }

      .btn-goback,
      .btn-home {
        width: 100%;
        justify-content: center;
      }

      .error-visual {
        gap: 4px;
      }
    }

    @media (max-width: 400px) {
      .error-card {
        padding: 32px 16px;
      }

      .error-code {
        font-size: 70px;
      }

      .robot-hand-icon {
        width: 48px;
        height: 48px;
        font-size: 20px;
      }

      .robot-hand-icon span {
        font-size: 26px;
      }
    }
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="error-card">
    <!-- Small brand badge -->
    <div class="stackly-badge">STACKLY · 404</div>

    <!-- Visual: 404 + futuristic hand icon (pure CSS) -->
    <div class="error-visual">
      <span class="error-code">
        4<span class="accent-digit">0</span>4
      </span>
      <div class="robot-hand-icon" aria-hidden="true">
        <span>✧</span>
      </div>
    </div>

    <!-- Main message -->
    <h1 class="error-title">Lost in the neural network?</h1>
    <p class="error-message">
      The page you're looking for doesn't exist or has been moved. 
      Let's get you back on track.
    </p>

    <!-- Primary actions: Go Back and Home -->
    <div class="error-actions">
      <!-- GO BACK button – goes to previous page using history.back() -->
      <button class="btn-goback" id="goBackBtn" aria-label="Go back to previous page">
        <span class="arrow">←</span>
        Go Back
      </button>
    </div>
  </main>

  <script>
    // ---- Go Back button: uses browser history, fallback to home if no history ----
    (function() {
      const goBackBtn = document.getElementById('goBackBtn');
      
      if (goBackBtn) {
        goBackBtn.addEventListener('click', function(e) {
          e.preventDefault(); // prevent any accidental default
          
          // Check if there is a previous page in history
          if (window.history.length > 1) {
            window.history.back();
          } else {
            // If no history (e.g., direct visit), redirect to home page
            window.location.href = 'index.html';
          }
        });
      }
    })();
  </script>
  <script src="script.js"></script>
</body>
</html>
